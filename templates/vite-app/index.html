<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>点点星球</title>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div><small>得分</small><strong id="score">0</strong></div>
    <div><small>连击</small><strong id="combo">0</strong></div>
    <div><small>时间</small><strong id="clock">30</strong></div>
    <div class="progress"><i id="progress"></i></div>
  </header>

  <main class="stage" id="stage">
    <div class="target" id="target"></div>
  </main>

  <section class="screen" id="screenStart">
    <h1>点点星球</h1>
    <p>30 秒，看谁点得又准又稳</p>
    <button class="btn" id="btnStart" type="button">开始</button>
    <p class="tip" id="tip"></p>
  </section>

  <section class="screen" id="screenResult" hidden>
    <p class="medal" id="medal">再来一次</p>
    <p class="final" id="final">0</p>
    <p class="meta"><span id="best">最佳 0</span> · <span id="maxCombo">最高连击 0</span></p>
    <button class="btn" id="btnAgain" type="button">再来一局</button>
    <button class="btn ghost" id="btnPoster" type="button" hidden>保存成绩图</button>
    <button class="btn ghost" id="btnShare" type="button" hidden>分享</button>
    <button class="btn ghost" id="btnFollow" type="button" hidden>关注作者</button>
  </section>

  <button class="sound" id="btnSound" type="button" aria-label="声音开关">🔊</button>
</div>
<div id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
